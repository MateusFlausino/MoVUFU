<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoV UFU - Rotas OpenStreetMap</title>
  <meta name="theme-color" content="#007aff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MoV UFU">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="control-panel" aria-label="Navegacao acessivel">
      <button type="button" id="toggleNavBtn" class="toggle-nav-btn" aria-expanded="true" aria-controls="navigatorCard">Ocultar</button>
      <button type="button" id="installAppBtn" class="install-app-btn" hidden>Instalar app</button>

      <header class="brand">
        <span class="brand__eyebrow">MoV UFU</span>
        <h1>Para onde vamos?</h1>
      </header>

      <div class="navigator-card" id="navigatorCard">
        <form class="route-form" id="routeForm">
          <label class="field" for="originSelect">
            <span>Saindo de</span>
            <select id="originSelect" name="origin"></select>
          </label>

          <button type="button" id="swapBtn" class="swap-route-btn" aria-label="Inverter origem e destino">Trocar</button>

          <label class="field" for="destinationSelect">
            <span>Indo para</span>
            <select id="destinationSelect" name="destination"></select>
          </label>

          <button type="submit" class="primary route-action">Traçar rota</button>
        </form>

        <section class="voice-panel" aria-label="Comando de voz para os pontos">
          <form id="voiceCommandForm" class="voice-command-form">
            <label class="field" for="voiceCommandInput">
              <span>Buscar por voz ou texto</span>
              <input type="text" id="voiceCommandInput" autocomplete="off" placeholder="De bloco 1E para bloco 3E">
            </label>
            <button type="submit" aria-label="Aplicar comando digitado">Ir</button>
          </form>
          <button type="button" id="voiceBtn" class="voice-fab" aria-label="Falar destino">🎙</button>
          <p id="voiceState" class="voice-state">Diga “do bloco 1E para o bloco 3E” ou apenas o destino.</p>
        </section>

        <section class="result-panel" aria-live="polite">
          <div class="route-output route-summary">
            <span>Rota acessivel</span>
            <strong id="routeDistance">-</strong>
          </div>

          <div class="route-output">
            <span>Caminho</span>
            <strong id="pathText">Escolha origem e destino.</strong>
          </div>
        </section>
      </div>

      <div class="technical-panel" aria-hidden="true">
        <div class="pick-panel" aria-label="Selecao por clique">
        <span>Click no no define</span>
        <div class="segmented" role="group" aria-label="Destino do click">
          <button type="button" id="pickOriginBtn" class="is-active">De</button>
          <button type="button" id="pickDestinationBtn">Para</button>
        </div>
        </div>

        <section class="admin-panel" aria-label="Edicao de altura dos predios">
        <div class="panel-title">
          <span>Modo admin</span>
          <button type="button" id="adminToggleBtn">Ativar</button>
        </div>
        <div id="adminEditor" class="admin-editor" hidden>
          <label class="field" for="buildingSelect">
            <span>Predio</span>
            <select id="buildingSelect" name="building"></select>
          </label>
          <label class="field" for="buildingHeightInput">
            <span>Altura em metros</span>
            <input type="number" id="buildingHeightInput" min="1" max="120" step="0.5" inputmode="decimal">
          </label>
          <div class="button-row admin-actions">
            <button type="button" class="primary" id="saveBuildingHeightBtn">Salvar</button>
            <button type="button" id="resetBuildingHeightBtn">Padrao</button>
          </div>
          <button type="button" class="text-button" id="resetAllBuildingHeightsBtn">Restaurar todas as alturas</button>
        </div>
        </section>

        <div class="metric-grid">
          <div>
            <span>Nos</span>
            <strong id="nodeCount">0</strong>
          </div>
          <div>
            <span>Ligacoes</span>
            <strong id="edgeCount">0</strong>
          </div>
        </div>

        <div class="route-output">
          <span>Trechos usados</span>
          <ol id="segmentList" class="segment-list"></ol>
        </div>

        <section class="nodes-panel">
        <div class="panel-title">
          <span>Nos da planta</span>
          <button type="button" id="fitBtn">Centralizar</button>
        </div>
        <div id="nodeList" class="node-list"></div>
        </section>
      </div>

      <p class="status" id="statusText">Carregando dados OpenStreetMap...</p>
    </section>

    <section class="map-panel" aria-label="OpenStreetMap do Campus Santa Monica">
      <div class="view-switch" role="group" aria-label="Tipo de mapa">
        <button type="button" id="svgViewBtn" hidden>Planta UFU</button>
        <button type="button" id="osmViewBtn" class="is-active">OpenStreetMap</button>
        <button type="button" id="mapboxViewBtn">Mapbox 3D</button>
      </div>

      <div class="map-toolbar is-hidden">
        <button type="button" id="zoomInBtn" aria-label="Aproximar">+</button>
        <button type="button" id="zoomOutBtn" aria-label="Afastar">-</button>
        <button type="button" id="resetViewBtn">100%</button>
      </div>

      <svg id="campusMap" class="campus-map is-hidden" role="img" aria-label="Planta baixa desativada">
        <defs>
          <filter id="routeGlow" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.65"/>
          </filter>
        </defs>
        <g id="backgroundLayer"></g>
        <g id="buildingLayer"></g>
        <g id="edgeLayer"></g>
        <g id="routeLayer"></g>
        <g id="nodeLayer"></g>
      </svg>

      <div id="mapboxMap" class="mapbox-map" aria-label="Mapa 3D do Campus Santa Monica"></div>
      <div id="osmMap" class="osm-map is-active" aria-label="OpenStreetMap com caminhos de pedestres e travessias do Campus Santa Monica"></div>
    </section>
  </main>

  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
